# The spikes are throwaway probes: they answer one question about a harness,
# then stay in the tree as the record of how it was answered. `tsconfig.json`
# excludes them from the build and `package.json` keeps them out of the
# published package, so nothing here ever runs for a user — and holding a probe
# to the standard of shipped code only teaches people to delete the evidence.
sonar.exclusions=spikes/**
